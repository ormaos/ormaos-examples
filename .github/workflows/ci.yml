name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  order-sync:
    name: order-sync on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run from a copy outside the repository
        run: |
          cp -r order-sync "$RUNNER_TEMP/order-sync"
          cd "$RUNNER_TEMP/order-sync"
          ./reset.sh
          test "$(python3 job.py)" = "sync finished: OK"
          test "$(python3 job.py)" = "sync finished: OK"
      - name: Check the stock levels after the CSV run
        run: python3 .github/scripts/check_order_sync.py "$RUNNER_TEMP/order-sync"
      - name: Run with the local API as the source
        run: |
          cd "$RUNNER_TEMP/order-sync"
          ./reset.sh
          test "$(python3 job.py --source api)" = "sync finished: OK"
      - name: Check the stock levels after the API run
        run: python3 .github/scripts/check_order_sync.py "$RUNNER_TEMP/order-sync"
      - name: Build the morning after a night run
        run: python3 scenarios/morning_after.py "$RUNNER_TEMP/morning-after"
      - name: Check the morning after
        run: python3 .github/scripts/check_morning_after.py "$RUNNER_TEMP/morning-after"

  freight-quote:
    name: freight-quote on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run from a copy outside the repository
        run: |
          cp -r freight-quote "$RUNNER_TEMP/freight-quote"
          cd "$RUNNER_TEMP/freight-quote"
          ./reset.sh
          test "$(python3 job.py)" = "quotes finished: OK"
      - name: Check the quotes
        run: python3 .github/scripts/check_freight_quote.py "$RUNNER_TEMP/freight-quote"
      - name: Build the morning after two night runs
        run: python3 scenarios/two_nights.py "$RUNNER_TEMP/two-nights"
      - name: Check the morning after
        run: python3 .github/scripts/check_two_nights.py "$RUNNER_TEMP/two-nights"

  docs:
    name: demo page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the benchmark pages name the commit that added each results file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check the page and its recordings
        run: python3 .github/scripts/check_docs.py docs
      - name: Check that the benchmark pages are a fresh build of the results files
        run: python3 site/benchmarks/build.py --check

  use-cases:
    name: use cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ormaos and the libraries of the use cases
        run: |
          pip install git+https://github.com/ormaos/ormaos-python
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r use-cases/web-backend/requirements.txt \
            -r use-cases/data-pipeline/requirements.txt \
            -r use-cases/notebook/requirements.txt \
            -r use-cases/ml-training/requirements.txt
      - name: Record each use case and compare every answer with questions.json
        run: |
          for name in web-backend data-pipeline notebook ml-training rl-env ai-app agent-change; do
            python "use-cases/$name/scenario.py" "$RUNNER_TEMP/$name" --check
          done

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
