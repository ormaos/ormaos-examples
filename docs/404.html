<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ormaos demo: page not found</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="https://ormaos.com/favicon.svg" type="image/svg+xml">

<script>
  (function () {
    // Light is the default. Dark only after the visitor picks it with the
    // header switch; nothing is stored until then.
    var t;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      document.querySelector('meta[name="theme-color"]').content = "#0a0a0a";
    }
  })();
</script>

<style>
/* The colours, header and footer are the ones of ormaos.com. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #f5f5f5;
  --text: #171717;
  --text-soft: #525252;
  --text-dim: #737373;
  --line: rgba(0, 0, 0, 0.12);
  --field: #8f8f8f;
  --button: #171717;
  --button-hover: #000000;
  --button-text: #ffffff;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0a0a;
  --panel: #1a1a1a;
  --text: #f5f5f5;
  --text-soft: #b5b5b5;
  --text-dim: #a3a3a3;
  --line: rgba(255, 255, 255, 0.14);
  --field: #737373;
  --button: #f5f5f5;
  --button-hover: #ffffff;
  --button-text: #0a0a0a;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  overflow-y: scroll;
  -webkit-text-size-adjust: 100%;
}

body {
  --gutter: 20px;
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

@media (min-width: 40rem) {
  body { --gutter: 24px; }
}

/* From 64rem the edges follow a 77rem column centred on wide screens. */
@media (min-width: 64rem) {
  body { --gutter: clamp(2rem, (100vw - 90rem) * 1.2 + 2rem, (100vw - 77rem) / 2); }
}

a {
  color: inherit;
  text-decoration: none;
  text-underline-offset: 4px;
}

a:hover {
  text-decoration: underline;
}

:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Header: the mark on the left, plain links on the right. It scrolls away
   with the page. */
.site-header {
  display: flex;
  align-items: center;
  height: 80px;
  padding-inline: var(--gutter);
}

.site-header nav {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  font-size: 16px;
  line-height: 24px;
  letter-spacing: -0.025em;
}

@media (min-width: 40rem) {
  .site-header nav { font-size: 18px; }
}

.home {
  display: flex;
  margin-left: -4px;
}

/* 40px puts the 320-unit mark on an 8-unit grid, so every bar edge lands on
   a whole pixel. */
.logo {
  width: 40px;
  height: 40px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 16px;
}

@media (min-width: 40rem) {
  .nav-links { gap: 28px; }
  .theme-switch button { padding-inline: 12px; }
}

.nav-github {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-github svg {
  width: 18px;
  height: 18px;
  flex: none;
}

/* Theme: a two-option switch, the current one filled. */
.theme-switch {
  display: flex;
  padding: 2px;
  border-radius: 9999px;
  background: var(--panel);
  font-size: 14px;
  line-height: 20px;
  letter-spacing: normal;
}

.theme-switch[hidden] {
  display: none;
}

.theme-switch button {
  padding: 4px 10px;
  border: 0;
  border-radius: 9999px;
  background: none;
  color: var(--text-soft);
  font: inherit;
  cursor: pointer;
}

.theme-switch button:hover {
  color: var(--text);
}

.theme-switch button[aria-pressed="true"] {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 0 0 1px var(--line);
}

.nav-links a[aria-current="page"] {
  text-decoration: underline;
}

@media (max-width: 26rem) {
  .nav-github span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* Main: text in one narrow column, recordings in a wider one. */
main {
  width: 100%;
  max-width: calc(60rem + 2 * var(--gutter));
  margin-inline: auto;
  padding: 80px var(--gutter) 64px;
}

@media (min-width: 48rem) {
  main { padding-top: 96px; }
}

.text {
  max-width: 36rem;
  margin-inline: auto;
}

h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 500;
  line-height: 1.375;
  letter-spacing: -0.025em;
}

.lead {
  margin: 16px 0 0;
  font-size: 18px;
  line-height: 1.625;
}

h2 {
  max-width: 36rem;
  margin: 64px auto 16px;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.5;
  letter-spacing: -0.025em;
}

@media (min-width: 48rem) {
  h1 { font-size: 22px; }
  .lead { font-size: 20px; line-height: 28px; }
  h2 { margin-top: 80px; }
}

p {
  margin: 0 0 16px;
  font-size: 16px;
  line-height: 1.625;
}

main a {
  text-decoration: underline;
}

code,
pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-variant-ligatures: none;
}

code {
  padding: 2px 5px;
  border-radius: 6px;
  background: var(--panel);
  font-size: 0.85em;
}

pre {
  margin: 0 0 16px;
  padding: 16px 20px;
  overflow-x: auto;
  border-radius: 12px;
  background: var(--panel);
  font-size: 12px;
  line-height: 1.7;
}

pre code {
  padding: 0;
  background: none;
  font-size: 1em;
}

/* Footer: one line, small and grey. */
footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: auto;
  padding: 16px var(--gutter);
  font-size: 14px;
  color: var(--text-dim);
}

footer ul {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.copyright {
  order: 2;
  margin: 8px 0 0;
}

@media (min-width: 48rem) {
  footer {
    flex-direction: row;
    justify-content: space-between;
    padding-block: 14px;
    font-size: 12px;
  }

  footer ul { order: 2; column-gap: 24px; }
  .copyright { order: 1; margin: 0; }
}
</style>
</head>
<body>

<header class="site-header">
  <nav aria-label="Main navigation">
    <a class="home" href="https://ormaos.com/" aria-label="Ormaos home">
      <svg class="logo" viewBox="0 0 320 320" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
        <rect x="96" y="32" width="128" height="64"/>
        <rect x="32" y="96" width="64" height="128"/>
        <rect x="224" y="96" width="64" height="128"/>
        <rect x="96" y="224" width="128" height="64"/>
      </svg>
    </a>
    <div class="nav-links">
      <a class="nav-github" href="https://github.com/ormaos">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
        <span>GitHub</span>
      </a>
      <a href="https://ormaos.com/demo/">Demo</a>
      <a href="https://ormaos.com/contact">Contact</a>
      <div class="theme-switch" role="group" aria-label="Theme" hidden>
        <button type="button" data-theme-option="light" aria-pressed="true">Light</button>
        <button type="button" data-theme-option="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </nav>
</header>
<script>
  (function (header) {
    // The theme switch stays hidden without JavaScript, where the page is
    // always light.
    var root = document.documentElement;
    var group = header.querySelector(".theme-switch");
    var buttons = group.querySelectorAll("button");
    var meta = document.querySelector('meta[name="theme-color"]');

    function apply(theme) {
      if (theme === "dark") root.setAttribute("data-theme", "dark");
      else root.removeAttribute("data-theme");
      Array.prototype.forEach.call(buttons, function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-theme-option") === theme ? "true" : "false");
      });
      meta.content = theme === "dark" ? "#0a0a0a" : "#ffffff";
    }

    apply(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
    group.hidden = false;

    Array.prototype.forEach.call(buttons, function (b) {
      b.addEventListener("click", function () {
        var theme = b.getAttribute("data-theme-option");
        apply(theme);
        try { localStorage.setItem("theme", theme); } catch (e) {}
      });
    });
  })(document.currentScript.previousElementSibling);
</script>

<main>
  <div class="text">
    <h1>Page not found</h1>
    <p class="lead">There is nothing at this address. The demo is at <a href="https://ormaos.com/demo/">ormaos.com/demo</a>.</p>
  </div>
</main>

<footer>
  <p class="copyright">&copy; 2026 Ormaos</p>
  <ul>
    <li><a href="https://github.com/ormaos">GitHub</a></li>
    <li><a href="https://x.com/ormaoshq">X (Twitter)</a></li>
    <li><a href="https://ormaos.com/privacy">Privacy</a></li>
    <li><a href="https://ormaos.com/contact">Contact</a></li>
    <li><a href="https://ormaos.com/llms.txt">For agents</a></li>
  </ul>
</footer>

</body>
</html>
